name: heats
version: "0.4.0"
manifest_version: 2
api_version: 1
description: "Your tests, not the model, decide when a fix is done: a referee runs your check before the agent finishes and sends it back on red; for hard bugs, race N attempts in git worktrees and apply the one that passes."
author: EconLearn
license: MIT
requires_hermes: ">=0.23.0"
tags: [coding, testing, verification, git, worktrees, subagents, best-of-n]
provides_tools:
  - heats_run
  - heats_wait
  - heats_apply
provides_hooks:
  - pre_tool_call
  - post_tool_call
  - pre_verify
provides_middleware:
  - tool_request
config_schema:
  default_heats: {type: int, default: 3, label: "Attempts per run", description: "How many attempts run in parallel when the request does not say (1-8)."}
  timeout_minutes: {type: float, default: 20, label: "Time limit (minutes)", description: "Unfinished attempts are stopped and judged as they stand."}
  check: {type: str, default: "", label: "Check command", description: "Command that exits 0 on success. Empty = auto-detect (pytest, npm/pnpm/yarn test, cargo test, go test, make test)."}
  check_timeout_seconds: {type: int, default: 600, label: "Check timeout (seconds)"}
  referee: {type: bool, default: true, label: "Referee", description: "When the agent edited code in a git repo and is about to finish, run the check; if it fails, send the agent back with the real output (up to Hermes's max_verify_nudges, 3)."}
  trusted_repos: {type: list, default: [], label: "Trusted repos", description: "Repos whose check Heats may run without asking. Empty by default: the referee skips other repos (and tells the agent to point you to /heats trust), and heats_run asks before it runs a check there. Only you add to it: /heats trust [repo] or `hermes heats trust [repo]`."}
  check_env: {type: list, default: [], label: "Extra env names for the check", description: "The check runs with a minimal environment (PATH, HOME, locale, temp dir, virtualenv/toolchain paths). Add any other variable names your tests need here. Provider keys never reach it unless you list them."}
  referee_timeout_seconds: {type: int, default: 25, label: "Referee check timeout (seconds)", description: "Capped 5 s below Hermes's plugins.hook_callback_timeout (default 30 s); raise that for slower test suites. A check that runs longer is skipped, never blamed on the agent."}
  models: {type: list, default: [], label: "Models to race", description: "Optional model names; attempts cycle through them. Empty = the delegation model."}
  toolsets: {type: list, default: ["terminal", "file"], label: "Attempt toolsets", description: "Toolsets each attempt may use (never broader than the parent's)."}
  protect_tests: {type: bool, default: true, label: "Protect tests", description: "An attempt that edits test files cannot win."}
  protected_paths: {type: list, default: [], label: "Other protected paths", description: "Files or folders an attempt may not change if it is to win."}
  laps: {type: int, default: 3, label: "Laps per attempt", description: "If an attempt finishes but the check still fails, Heats restarts it in the same worktree with the real test output (up to this many times in total)."}
  finish_early: {type: bool, default: true, label: "Finish at the first pass", description: "The first attempt that passes cleanly ends the race; the others are stopped and judged as they stand."}
  wait_seconds: {type: int, default: 360, label: "Wait per tool call (s)", description: "How long heats_run / heats_wait block before returning a progress update. Keep it below Hermes's tool deadline (tools.sequential_call, 420 s by default)."}
  run_baseline: {type: bool, default: true, label: "Run the check before", description: "Run the check once on the starting code so the scoreboard shows before and after."}
